<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Manager - PHP JSON API + Fetch</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #222; }
    .container { max-width: 900px; margin: auto; }
    h1 { text-align: center; color: #1f3a8a; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); margin-bottom: 20px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { padding: 10px 14px; border: 0; border-radius: 4px; cursor: pointer; font-size: 14px; color: #fff; }
    .btn-primary { background: #2563eb; }
    .btn-secondary { background: #6b7280; }
    .btn-edit { background: #f59e0b; }
    .btn-delete { background: #dc2626; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #eef2ff; }
    td.actions { display: flex; gap: 6px; }
    #message { padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
    #message.success { display: block; background: #dcfce7; color: #166534; }
    #message.error { display: block; background: #fee2e2; color: #991b1b; }
    #loader { display: none; text-align: center; padding: 15px; color: #2563eb; font-weight: bold; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid #bfdbfe;
               border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; color: #6b7280; padding: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Student Manager</h1>

    <div id="message"></div>

    <div class="card">
      <h3 id="formTitle">Add Student</h3>
      <form id="studentForm">
        <input type="hidden" id="studentId">
        <input type="text" id="name" placeholder="Full name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="course" placeholder="Course" required>
        <button type="submit" class="btn-primary" id="submitBtn">Add</button>
        <button type="button" class="btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
      </form>
    </div>

    <div class="card">
      <h3>Student List</h3>
      <div id="loader"><span class="spinner"></span>Loading...</div>
      <table id="studentTable">
        <thead>
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Actions</th></tr>
        </thead>
        <tbody id="studentBody"></tbody>
      </table>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
