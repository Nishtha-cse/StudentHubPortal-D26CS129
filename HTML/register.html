<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="images/charusat.png" type="image/png">
<title>Register - StudentHub</title>
</head>
<body class="page-register">
<header>
  <div class="brand">
    <img src="images/charusat.png" alt="CHARUSAT logo">
    <h1>Register</h1>
  </div>
  <nav aria-label="Main navigation">
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="event.html">Events</a></li>
      <li><a href="faqs.html">FAQ</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="feedback.html">Feedback</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html" aria-current="page">Register</a></li>
    </ul>
  </nav>
</header>

<main id="main-content">
  <section aria-labelledby="register-heading">
    <h2 id="register-heading">Create an Account</h2>
    <form action="#" method="post">
      <label for="fullname">Full Name</label><br>
      <input type="text" id="fullname" name="fullname"><br><br>

      <label for="email">Email</label><br>
      <input type="email" id="email" name="email"><br><br>

      <label for="studentid">Student ID</label><br>
      <input type="text" id="studentid" name="studentid"><br><br>

      <label for="password">Password</label><br>
      <input type="password" id="password" name="password"><br><br>

      <label for="confirmpassword">Confirm Password</label><br>
      <input type="password" id="confirmpassword" name="confirmpassword"><br><br>

      <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login</a></p>
  </section>
</main>

<footer>
  <nav aria-label="Footer navigation">
    <a href="contact.html">Contact</a> |
    <a href="about.html">About</a>
  </nav>
  <p>&copy; 2026 StudentHub</p>
</footer>

</body>
</html>
