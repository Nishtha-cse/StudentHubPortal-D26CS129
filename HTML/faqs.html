<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="../images/charusat.png" type="image/png">
<title>FAQ - StudentHub</title>
<script>
  (function () {
    var saved = localStorage.getItem("studenthub-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
</head>
<body>
<header>
  <div class="brand">
    <img src="../images/charusat.png" alt="CHARUSAT logo">
    <h1>Frequently Asked Questions</h1>
  </div>
    <div class="header-actions">
    <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">Dark mode</button>
    <button type="button" class="nav-toggle" aria-controls="primary-nav" aria-expanded="false">
      <span class="hamburger-icon" aria-hidden="true"></span>
      <span>Menu</span>
    </button>
  </div>
<nav aria-label="Main navigation" id="primary-nav">
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="event.html">Events</a></li>
      <li><a href="faqs.html" aria-current="page">FAQ</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="feedback.html">Feedback</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>
</header>

<main id="main-content">
  <section aria-labelledby="faq-heading" class="data-section">
    <h2 id="faq-heading">Frequently Asked Questions</h2>

    <div class="toolbar" role="search">
      <div class="field">
        <label for="searchInput">Search</label>
        <input type="search" id="searchInput" placeholder="Type to search...">
      </div>
      <div class="field">
        <label for="categoryFilter">Category</label>
        <select id="categoryFilter" class="form-select"><option value="">All categories</option></select>
      </div>
      <div class="field">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect" class="form-select">
          <option value="default">Default order</option>
          <option value="question-asc">Question (A-Z)</option>
          <option value="category-asc">Category</option>
        </select>
      </div>
      <div class="field field-button">
        <button type="button" id="resetBtn">Reset</button>
      </div>
    </div>

    <div id="status" class="status" hidden></div>
    <p id="resultCount" class="result-count" aria-live="polite"></p>
    <div id="list" class="faq-list"></div>
    <nav id="pagination" class="pagination" aria-label="FAQ pages"></nav>
  </section>
</main>

<footer>
  <nav aria-label="Footer navigation">
    <a href="contact.html">Contact</a> |
    <a href="about.html">About</a>
  </nav>
  <p>&copy; 2026 StudentHub</p>
</footer>

<script src="../JAVASCRIPT/theme.js" defer></script>
<script src="../JAVASCRIPT/menu.js" defer></script>
<script src="../JAVASCRIPT/accordion.js" defer></script>
<script type="module" src="../JAVASCRIPT/faqs.js"></script>
</body>
</html>
