<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/style.css">
<link rel="icon" href="../images/charusat.png" type="image/png">
<title>Login - StudentHub</title>
<script>
  (function () {
    var saved = localStorage.getItem("studenthub-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  })();
</script>
</head>
<body>
<header>
  <div class="brand">
    <img src="../images/charusat.png" alt="CHARUSAT logo">
    <h1>Login</h1>
  </div>
    <div class="header-actions">
    <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false">Dark mode</button>
    <button type="button" class="nav-toggle" aria-controls="primary-nav" aria-expanded="false">
      <span class="hamburger-icon" aria-hidden="true"></span>
      <span>Menu</span>
    </button>
  </div>
<nav aria-label="Main navigation" id="primary-nav">
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="event.html">Events</a></li>
      <li><a href="faqs.html">FAQ</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="feedback.html">Feedback</a></li>
      <li><a href="login.html" aria-current="page">Login</a></li>
      <li><a href="register.html">Register</a></li>
    </ul>
  </nav>
</header>

<main id="main-content">
  <section aria-labelledby="login-heading">
    <h2 id="login-heading">Login to Your Account</h2>
    <form action="#" method="post">
      <label for="username">Username</label><br>
      <input type="text" id="username" name="username"><br><br>

      <label for="password">Password</label><br>
      <input type="password" id="password" name="password"><br><br>

      <button type="submit">Login</button>
    </form>

    <p><a href="#">Forgot Password?</a></p>
    <p>Don't have an account? <a href="register.html">Register</a></p>
  </section>
</main>

<footer>
  <nav aria-label="Footer navigation">
    <a href="contact.html">Contact</a> |
    <a href="about.html">About</a>
  </nav>
  <p>&copy; 2026 StudentHub</p>
</footer>

<script src="../js/theme.js" defer></script>
<script src="../js/menu.js" defer></script>
</body>
</html>
